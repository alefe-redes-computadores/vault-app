name: VAULT Macro02 physical NON_JSON recovery LAB ONLY
on:
  push:
    branches: ['vault-lab/macro02-non-json-2e3a8a99a0ba']
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and preserved gate
        run: |
          test "$(git rev-parse HEAD^)" = "2e3a8a99a0ba033a8b682ac8d88ae86e6b3cbebc"
          git checkout --detach 2e3a8a99a0ba033a8b682ac8d88ae86e6b3cbebc
          test "$(git rev-parse HEAD^{tree})" = "20f5372359e6328aa7126aa3d45d1103f318c014"
          git merge-base --is-ancestor 2e55f9e6aba09af66cdffabb92dfc9ac1395a3a4 HEAD
          git diff --check 2e55f9e6aba09af66cdffabb92dfc9ac1395a3a4 HEAD
          git diff --exit-code 2e55f9e6aba09af66cdffabb92dfc9ac1395a3a4 HEAD -- scripts/test-v63-release-gate.mjs scripts/test-vault-stability-360.cjs scripts/macro02-auto-preparation-contracts.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/test-vault-macro02-operational-recovery.cjs
      - run: node scripts/test-vault-macro02-cutover-recovery.cjs
      - run: node node_modules/typescript/bin/tsc --noEmit
      - name: V63 cumulative release contracts
        run: node scripts/test-v63-release-gate.mjs
      - name: Android Web export (synthetic configuration)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-lab-only
        run: npm run build:export
