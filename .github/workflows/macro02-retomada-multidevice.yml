name: VAULT Macro02 two independent devices - LAB ONLY
on:
  push:
    branches: ['vault-lab/macro02-retomada-20261128']
    paths: ['.github/workflows/macro02-retomada-multidevice.yml']
permissions:
  contents: read
jobs:
  integrated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4173
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-not-a-production-key
      NEXT_TELEMETRY_DISABLED: '1'
      CAPACITOR_BUILD: '0'
      VAULT_WEB_STATIC_BUILD: '1'
      NEXT_PUBLIC_VAULT_NATIVE_RUNTIME: web
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6ef2cc5506963b5dc6fe9fad40790e79bf3b101
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover previously certified browser harness; no production data
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 18575a1b5da20acb21a11e531aa6403793b72922
          ui="$RUNNER_TEMP/macro02-ui"
          mkdir -p "$ui"
          for f in bootstrap.cjs browser.cjs profile-contract.cjs queue-contract.cjs run.sh; do
            git show da1bc6d149dc11884f4c303a2877a5f585ccae64:.github/macro02-ui/"$f" > "$ui/$f"
          done
          test "$(git hash-object "$ui/bootstrap.cjs")" = 83ff3c618167f73690aa3ea251d6896108c17aac
          test "$(git hash-object "$ui/browser.cjs")" = 460cd7e8bfb1781b608ce68f7479be00d8b640c5
          test "$(git hash-object "$ui/run.sh")" = c99b6611679ef4d175b0723a5e3bfb92c07a9550
          python3 - "$ui/browser.cjs" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          marker='(async()=>{\n assert.equal(enroll().state'
          assert s.count(marker)==1
          head=s[:s.index(marker)]
          old='const open=async()=>{const c=await chromium.launchPersistentContext(profile,'
          assert head.count(old)==1
          head=head.replace(old,'const open=async(profile=globalThis.__unusedProfile)=>{const c=await chromium.launchPersistentContext(profile,')
          p.write_text(head+"const profileB=fs.mkdtempSync(path.join(os.tmpdir(),'vault-device-b-'));\nconst pick=async(p)=>{if(ctx)await ctx.close();ctx=null;ctx=await open(p);page=ctx.pages()[0]||await ctx.newPage();track(page);};\nconst clinicalPending=x=>x.queue.filter(q=>q.payload?.macro02_atomic||q.payload?.macro02_compound||q.payload?.macro02_metadata);\nconst seedVerify=async(p,s)=>{\n await pick(p);await navigate('/__vault_lab_bootstrap');await page.evaluate(s=>localStorage.setItem('sb-127-auth-token',JSON.stringify(s)),session);await attach();assert.equal((await local()).device,undefined);await page.evaluate(({s,settings})=>window.__vaultLab.seed(s,settings),{s,settings});\n await navigate('/hoje');await page.getByRole('heading',{name:'Conferência de autoridade clínica'}).waitFor({timeout:120000});assert.equal(await center().count(),0);await page.getByRole('link',{name:'Abrir Central de segurança'}).click();\n const before=calls.filter(c=>c.name==='vault_macro02_active_snapshot_r5').length;\n await page.getByRole('button',{name:'Conferir aparelho',exact:true}).click({timeout:120000});await attach();await wait(async()=>{const d=(await local()).device;return d?.epoch===ep&&/^[a-f0-9]{64}$/.test(d.local_sha256)&&/^[a-f0-9]{64}$/.test(d.remote_sha256)&&await page.getByRole('button',{name:'Conferir aparelho',exact:true}).count()===0},'verified independent device');\n assert(calls.filter(c=>c.name==='vault_macro02_active_snapshot_r5').length>=before+2);\n await navigate('/hoje');await center().waitFor({timeout:120000});assert.equal(await page.getByRole('heading',{name:'Conferência de autoridade clínica'}).count(),0);\n};\nconst syncUI=async()=>{await navigate('/recuperacao');await page.getByRole('button',{name:'Conferir e sincronizar',exact:true}).click({timeout:120000});await attach();};\nconst taken=(x,h)=>x.doses.filter(d=>d.medicamento_id===mid&&d.horario===h&&d.tomado_em);\nconst remoteTaken=(h)=>snapshot().rows.doseLogs.filter(d=>d.medicamento_id===mid&&d.horario===h&&d.tomado_em);\nconst recordDose=async(h,expected)=>{\n await navigate('/hoje');await center().waitFor({timeout:120000});await center().getByRole('button',{name:'Pendentes',exact:true}).click();\n await center().getByRole('button',{name:'Conferir dose de QA Dose Sintetica, '+h,exact:true}).click();await page.getByRole('button',{name:'Tomar',exact:true}).click();await page.getByRole('heading',{name:'Registrar Dose',exact:true}).waitFor({timeout:60000});await page.getByRole('button',{name:'comprimido',exact:true}).click();await page.getByRole('button',{name:'Registrar tomada agora',exact:true}).click();await page.getByRole('button',{name:new RegExp('^Tomei às '+h)}).click();await attach();\n await wait(async()=>{const x=await local();return taken(x,h).length===1&&localMed(x,mid).estoque_quantidade===expected&&clinicalPending(x).length===0&&remoteTaken(h).length===1&&med(snapshot(),mid).estoque_quantidade===expected},'device dose acknowledged '+h,180000);\n const d=taken(await local(),h)[0];assert.equal(d.id,remoteTaken(h)[0].id);assert.equal(d.quantidade,1);assert.equal(d.unidade_dose,'tablet');return d.id;\n};\n(async()=>{\n assert.equal(enroll().state,'premium');const initial=snapshot();\n await new Promise((resolve,reject)=>{server.once('error',reject);server.listen(4173,'127.0.0.1',resolve)});\n await seedVerify(profile,initial);\n await seedVerify(profileB,initial);assert.notEqual(profile,profileB);console.log('TWO_INDEPENDENT_PROFILES_VERIFIED_PASS');\n await pick(profile);await navigate('/saude/medicamentos/saldo?id='+mid+'&return_to=%2Fhoje');await page.getByText('QA Dose Sintetica',{exact:true}).waitFor({timeout:120000});await page.getByLabel('Quantidade disponível agora').fill('10');await page.getByRole('button',{name:'Confirmar contagem',exact:true}).click();await page.waitForURL(/\\/hoje(?:\\?|$)/,{timeout:120000});await attach();\n await wait(async()=>{const x=await local();return localMed(x,mid)?.estoque_ciclo_id&&clinicalPending(x).length===0&&med(snapshot(),mid).estoque_ciclo_id===localMed(x,mid).estoque_ciclo_id},'A count acknowledged');\n const aId=await recordDose('00:00',9);\n const rxId=await page.evaluate(()=>window.__vaultLab.unquantified());\n await wait(async()=>{const x=await local();return x.rx.some(r=>r.id===rxId&&r.synced===true)&&clinicalPending(x).length===0&&snapshot().rows.renovacoes.some(r=>r.id===rxId&&r.quantidade===null)},'A acquisition acknowledged',180000);\n await pick(profileB);await navigate('/__vault_lab_bootstrap');await attach();const stale=await local();assert.equal(taken(stale,'00:00').length,0);assert.equal(localMed(stale,mid).estoque_quantidade,10);assert(!stale.rx.some(r=>r.id===rxId));await syncUI();\n await wait(async()=>{const x=await local();return taken(x,'00:00').length===1&&taken(x,'00:00')[0].id===aId&&localMed(x,mid).estoque_quantidade===9&&localMed(x,mid).estoque_ciclo_id===med(snapshot(),mid).estoque_ciclo_id&&x.rx.some(r=>r.id===rxId&&r.quantidade===null)&&localMed(x,mid2).estoque_quantidade===7&&clinicalPending(x).length===0},'B pulls A dose, stock, acquisition',180000);console.log('DEVICE_A_TO_B_REAL_PULL_PASS');\n const bId=await recordDose('00:01',8);assert.notEqual(aId,bId);\n await pick(profile);await navigate('/__vault_lab_bootstrap');await attach();assert.equal(taken(await local(),'00:01').length,0);await syncUI();\n await wait(async()=>{const x=await local();return taken(x,'00:00').length===1&&taken(x,'00:01').length===1&&taken(x,'00:01')[0].id===bId&&localMed(x,mid).estoque_quantidade===8&&clinicalPending(x).length===0},'A pulls B dose and stock',180000);\n const final=snapshot();assert.deepEqual(final.rows.doseLogs.filter(d=>d.medicamento_id===mid&&d.tomado_em).map(d=>d.id).sort(),[aId,bId].sort());assert.equal(med(final,mid).estoque_quantidade,8);assert.equal(final.rows.renovacoes.filter(r=>r.id===rxId).length,1);assert.equal(med(final,mid2).estoque_quantidade,7);\n await navigate('/hoje');await center().waitFor({timeout:60000});await center().getByRole('button',{name:'Histórico',exact:true}).click();await center().getByText('Tomada registrada',{exact:true}).first().waitFor({timeout:60000});await screenshot('device-a-final-history');\n console.log('DEVICE_B_TO_A_REAL_PULL_PASS');console.log('TWO_DEVICES_NO_DUPLICATE_STOCK_OR_HISTORY_PASS');\n})().catch(async e=>{console.error('MULTIDEVICE_FAIL',e.stack||e.message);process.exitCode=1;try{if(page){await screenshot('failure');console.log('PAGE_URL='+page.url());console.log('PAGE_TEXT='+String(await page.locator('body').innerText()).slice(0,2500));fs.writeFileSync(path.join(logs,'failure.html'),await page.content());}}catch{}}).finally(async()=>{blocked=false;if(ctx)await ctx.close();for(const s of sockets)s.destroy();await new Promise(r=>server.close(r));fs.rmSync(profile,{recursive:true,force:true});fs.rmSync(profileB,{recursive:true,force:true});});\n")
          PY
          python3 - "$ui/run.sh" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          a = 'psql_admin < "$p/active-fixture-r7.sql"'
          b = "psql_lab <<'UI_SEED_SQL'"
          assert s.count(a) == 1 and s.count(b) == 1
          s = s.replace(a, a + '\npsql_lab < "$p/cas-r04-m03-fixture.sql"\npsql_lab < supabase/migrations/20261126161012_vault_stb11_visual_cas_r03.sql')
          s = s.replace(b, 'psql_lab < supabase/migrations/20261127152804_vault_stb11_visual_cas_r04.sql\n' + b)
          p.write_text(s)
          PY
          {
            printf 'UI_GATE_DIR=%s\n' "$ui"
            printf 'ESBUILD_MODULE=%s\n' "$ui/tools/node_modules/esbuild"
            printf 'PLAYWRIGHT_MODULE=%s\n' "$ui/tools/node_modules/playwright"
            printf 'BOOTSTRAP_BUNDLE=%s\n' "$ui/bootstrap.js"
          } >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
      - name: Web export and inherited contracts
        run: |
          npm ci --no-audit --no-fund
          node "$UI_GATE_DIR/queue-contract.cjs" "$PWD"
          node "$UI_GATE_DIR/profile-contract.cjs" "$PWD"
          node scripts/ci-build-web-resilient.cjs 2>&1 | tee "$UI_GATE_DIR/build.log"
          node scripts/verify-static-release-stability.cjs web | tee "$UI_GATE_DIR/static.log"
      - name: Chromium, actual IndexedDB, PG17 and receipt lifecycle
        run: |
          npm install --prefix "$UI_GATE_DIR/tools" --no-audit --no-fund --save-exact playwright@1.56.1 esbuild@0.25.12
          "$UI_GATE_DIR/tools/node_modules/.bin/playwright" install --with-deps chromium
          node "$UI_GATE_DIR/bootstrap.cjs"
          bash "$UI_GATE_DIR/run.sh" 2>&1 | tee "$UI_GATE_DIR/browser.log"
          grep -Fxq TWO_INDEPENDENT_PROFILES_VERIFIED_PASS "$UI_GATE_DIR/browser.log"
          grep -Fxq DEVICE_A_TO_B_REAL_PULL_PASS "$UI_GATE_DIR/browser.log"
          grep -Fxq DEVICE_B_TO_A_REAL_PULL_PASS "$UI_GATE_DIR/browser.log"
          grep -Fxq TWO_DEVICES_NO_DUPLICATE_STOCK_OR_HISTORY_PASS "$UI_GATE_DIR/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro02-independent-devices
          path: |
            ${{ runner.temp }}/macro02-ui/*.log
            ${{ runner.temp }}/macro02-ui/*.png
            ${{ runner.temp }}/macro02-ui/failure.html
          if-no-files-found: warn
