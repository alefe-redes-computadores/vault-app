name: VAULT Macro03 R03 — targeted isolation retest (R02 host evidence retained)
on:
  push:
    branches: ['vault/lab/evolution03-20261126-r03']
permissions:
  contents: read
concurrency:
  group: vault-evo03-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r03'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install only compiler into disposable laboratory
        run: |
          npm install --prefix "$RUNNER_TEMP/evo03-tsc" --no-save --no-audit --no-fund --ignore-scripts typescript@5.5.4
          mkdir -p "$EVO03_LAB/candidate/node_modules/.bin"
          ln -s "$RUNNER_TEMP/evo03-tsc/node_modules/.bin/tsc" "$EVO03_LAB/candidate/node_modules/.bin/tsc"
      - name: PostgreSQL 17.6 and PostgREST concurrent laboratory (no ports)
        run: bash "$EVO03_LAB/tools/ci-pg17-docker.sh"
  browser:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r03'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact lockfile and pinned browser driver
        run: |
          cd "$EVO03_LAB/candidate" && npm ci
          npm install --prefix "$RUNNER_TEMP/evo03-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/evo03-browser/node_modules/.bin/playwright" install chromium --with-deps
      - name: Real IndexedDB/Dexie (synthetic identities)
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/evo03-browser/node_modules/playwright" node "$EVO03_LAB/tools/ci-browser-dexie.cjs"
  android-build:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r03'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Compile native scanner and nutrition read bridge independently
        run: |
          set -euo pipefail
          cd "$EVO03_LAB/candidate"
          export JAVA_HOME="${JAVA_HOME_17_X64:?missing JDK17}"
          export PATH="$JAVA_HOME/bin:$PATH"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK" && test -d "$SDK" || { echo 'STOP missing Android SDK'; exit 2; }
          SDK="$(realpath "$SDK")"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          if ! test -s "$SDK/platforms/android-36/android.jar"; then
            sdkmanager_bin=""
            if test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"; then
              sdkmanager_bin="$SDK/cmdline-tools/latest/bin/sdkmanager"
            else
              sdkmanager_bin="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' -executable 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin" || { echo 'STOP SDK manager missing inside Android SDK'; exit 2; }
            sdkmanager_bin="$(realpath "$sdkmanager_bin")"
            [[ "$sdkmanager_bin" == "$SDK/"* ]] || { echo 'STOP SDK manager outside SDK'; exit 2; }
            "$sdkmanager_bin" --sdk_root="$SDK" 'platforms;android-36'
          fi
          test -s "$SDK/platforms/android-36/android.jar" || { echo 'STOP Android 36 platform missing'; exit 2; }
          echo 'ANDROID_PLATFORM_36_VERIFIED'
          # R02 static export succeeded on unchanged app bytes; this job tests only native compile.
          # Always compile against a synthetic HTML page, not a real account/session.
          test ! -d android
          if test -d out; then mv out "$RUNNER_TEMP/evo03-app-export"; fi
          mkdir out
          printf '<!doctype html><title>VAULT isolated native compile</title>' > out/index.html
          node node_modules/@capacitor/cli/bin/capacitor add android
          node scripts/patch-android-edge-to-edge-v28.mjs
          node scripts/patch-android-health-connect-v113.mjs
          node scripts/patch-android-exact-alarms-m99.mjs
          node scripts/apply-android-native-updater-m111.mjs
          node scripts/check-android-native-updater-m111.mjs
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_vault.xml android/app/src/main/res/drawable/ic_stat_vault.xml
          python3 scripts/prepare-android-nutrition-f2.py --root "$PWD" --isolated-review --health-connect-nutrition-review
          cd android
          bash ./gradlew :app:assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo 'NATIVE_COMPILE_PASS; SYNTHETIC HTML; NOT PHYSICAL QA OR DISTRIBUTION'
  catalog-acquisition:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r03'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Capture official public sources, no approval or publishing
        run: |
          python3 -m venv "$RUNNER_TEMP/catalog-venv"
          source "$RUNNER_TEMP/catalog-venv/bin/activate"
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          bash "$EVO03_LAB/tools/ci-official-catalog-capture.sh"
      - name: Preserve public-source provenance (no clinical data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-catalog-provenance-review-only
          path: ${{ runner.temp }}/evo03-catalog-evidence/
          if-no-files-found: warn
          retention-days: 7
  host-differential:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r03'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Original 15 failed contracts only, paired parent and candidate
        run: python3 "$EVO03_LAB/tools/ci-host-differential.py"
      - name: Preserve original failure signatures and differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-r03-host-differential
          path: ${{ runner.temp }}/evo03-host-differential/
          if-no-files-found: warn
          retention-days: 7
