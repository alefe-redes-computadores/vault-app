name: VAULT Macro03 R17 — exact catalog authority (review only)
on:
  push:
    branches: ['vault/lab/evolution03-20261126-r17']
permissions:
  contents: read
concurrency:
  group: vault-evo03-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-review:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r17'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Full candidate TypeScript
        run: cd "$EVO03_LAB/candidate" && ./node_modules/.bin/tsc --noEmit
      - name: Prior writer predicates preserved
        run: PYTHONDONTWRITEBYTECODE=1 python3 "$EVO03_LAB/tests/test_r16_domain_conflicts.py"
      - name: Catalog review ledger remains pending
        run: python3 "$EVO03_LAB/tools/catalog-review-ledger.py" verify "$EVO03_LAB/evidence/rodada-R12/catalog-triage" "$EVO03_LAB/evidence/r15/catalog-review-ledger.jsonl"
      - name: Exact official source proofs and real PostgreSQL/PostgREST registry checks
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evo03-r17-server"
          bash "$EVO03_LAB/tools/ci-r17-pg17-docker.sh" 2>&1 | tee "$RUNNER_TEMP/evo03-r17-server/server.log"
      - name: Install pinned browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/evo03-ui" --no-save --no-audit --no-fund --ignore-scripts playwright@1.55.0 esbuild@0.25.5
          "$RUNNER_TEMP/evo03-ui/node_modules/.bin/playwright" install chromium --with-deps
      - name: Changed catalog journey on real Dexie
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/evo03-ui/node_modules/playwright" ESBUILD_MODULE="$RUNNER_TEMP/evo03-ui/node_modules/esbuild" node "$EVO03_LAB/tools/ci-r17-catalog-ui.cjs"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-r17-server
          path: |
            ${{ runner.temp }}/evo03-r17-server/
            ${{ runner.temp }}/evo03-r17-browser/
            ${{ runner.temp }}/evo03-reanchor-receipt.json
          if-no-files-found: warn
          retention-days: 30
