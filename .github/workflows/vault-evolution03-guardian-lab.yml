name: VAULT Macro03 R19.1 — functional review only
on:
  push:
    branches: ['vault/lab/evolution03-20261126-r191']
permissions:
  contents: read
concurrency:
  group: vault-evo03-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional-review:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r191'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Full candidate TypeScript
        run: cd "$EVO03_LAB/candidate" && ./node_modules/.bin/tsc --noEmit
      - name: Prior writer predicates and native preparation
        run: |
          python -B "$EVO03_LAB/tests/test_r16_domain_conflicts.py"
          python -B "$EVO03_LAB/tests/test_android_prepare.py"
      - name: Catalog remains locked
        run: python3 "$EVO03_LAB/tools/catalog-review-ledger.py" verify "$EVO03_LAB/evidence/rodada-R12/catalog-triage" "$EVO03_LAB/evidence/r15/catalog-review-ledger.jsonl"
      - name: Install pinned browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/evo03-ui" --no-save --no-audit --no-fund --ignore-scripts playwright@1.55.0 esbuild@0.25.5
          "$RUNNER_TEMP/evo03-ui/node_modules/.bin/playwright" install chromium --with-deps
      - name: Functional browser review — independent mandatory lanes
        run: bash "$EVO03_LAB/tools/ci-r19-functional.sh"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-r19-functional-review
          path: |
            ${{ runner.temp }}/evo03-r19-functional/
            ${{ runner.temp }}/evo03-r19-*-evidence/
            ${{ runner.temp }}/evo03-reanchor-receipt.json
          if-no-files-found: warn
          retention-days: 30
