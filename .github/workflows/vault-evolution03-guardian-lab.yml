name: VAULT Macro03 R14 — immutable plan target writer and integrated transport
on:
  push:
    branches: ['vault/lab/evolution03-20261126-r14']
permissions:
  contents: read
concurrency:
  group: vault-evo03-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  global-gate:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r14'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        id: deps
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Full TypeScript and real consumer projection
        run: |
          cd "$EVO03_LAB/candidate"
          node_modules/.bin/tsc --noEmit
          node "$EVO03_LAB/tools/test-consumer-host.cjs"
      - name: Cumulative fixtures
        if: always() && steps.deps.outcome == 'success'
        run: |
          export PATH="$EVO03_LAB/candidate/node_modules/.bin:$PATH"
          bash "$EVO03_LAB/tools/validate-fixture.sh"
      - name: Entire canonical release gate, collect all failures
        if: always() && steps.deps.outcome == 'success'
        run: bash "$EVO03_LAB/tools/ci-r14-global-gate.sh"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-r14-global-gate
          path: |
            ${{ runner.temp }}/evo03-r14-host/
            ${{ runner.temp }}/evo03-reanchor-receipt.json
          if-no-files-found: warn
          retention-days: 30
  server-review:
    if: github.ref == 'refs/heads/vault/lab/evolution03-20261126-r14'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: bash .vault-evo03-lab/prepare.sh
      - name: Install exact application lockfile
        run: cd "$EVO03_LAB/candidate" && npm ci
      - name: Real PostgreSQL and PostgREST client adapters, isolated Unix sockets
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evo03-r14-server"
          bash "$EVO03_LAB/tools/ci-r14-pg17-docker.sh" 2>&1 | tee "$RUNNER_TEMP/evo03-r14-server/server.log"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evo03-r14-server
          path: |
            ${{ runner.temp }}/evo03-r14-server/
            ${{ runner.temp }}/evo03-reanchor-receipt.json
          if-no-files-found: warn
          retention-days: 30
