name: Promover APK VAULT certificado

on:
  # Apenas depois de a Action inteira terminar; não libera um build em andamento.
  workflow_run:
    workflows: ["Compilar APK Vault"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID da execução Android original (não é o build number)'
        required: true
        type: string
      expected_sha:
        description: 'Commit SHA completo do APK compilado'
        required: true
        type: string
      allow_stale:
        description: 'Permitir SHA ancestral quando a main avançou (exige autorização de ambiente)'
        type: boolean
        default: false
      approved_stale_sha:
        description: 'SHA completo explicitamente aprovado para distribuição tardia'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vault-android-release-gate
  cancel-in-progress: false

jobs:
  promote:
    name: Autorizar e conferir o APK já compilado
    if: >-
      vars.VAULT_ALLOW_STRICT_ANDROID_RELEASE == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O administrador PRECISA habilitar required reviewers e proteção main neste Environment.
    environment: vault-android-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout do publicador revisado na main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node 22 e Java 17 (sem recompilar APK)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Revalidar binário original e criar release imutável
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VAULT_DEBUG_KEYSTORE_BASE64: ${{ secrets.VAULT_DEBUG_KEYSTORE_BASE64 }}
          VAULT_ALLOW_STRICT_ANDROID_RELEASE: ${{ vars.VAULT_ALLOW_STRICT_ANDROID_RELEASE }}
          VAULT_RELEASE_POLICY_READY: ${{ vars.VAULT_RELEASE_POLICY_READY }}
          VAULT_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          VAULT_EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
          VAULT_ALLOW_STALE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_stale && '1' || '0' }}
          VAULT_APPROVED_STALE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_stale_sha || '' }}
        run: bash scripts/vault-publish-verified-action.sh
