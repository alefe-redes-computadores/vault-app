name: VAULT Macro02 - gates finais integrados (LAB ONLY)
on:
  push:
    branches: ['vault-lab/macro02-final-integrated-r9-*']
permissions:
  contents: read
jobs:
  active-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fonte imutavel e delta exclusivo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/vault-lab/macro02-final-integrated-r9-* ]]
          test "$(git rev-parse HEAD^^)" = 141b82843baeb94b599c8ac2578ba1ac3094c1d7
          test "$(git rev-parse HEAD~2^{tree})" = af8f0153c71ca569b958626cbe72ce0025f74f3b
          test "$(cat vercel.json)" = '{"ignoreCommand":"exit 0"}'
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/macro02-qa/final-r9-manifest.json .github/macro02-qa/run-active-r7-pg.sh .github/workflows/macro02-final-integrated-r9.yml vercel.json | LC_ALL=C sort)"
          git show HEAD:.github/macro02-qa/final-r9-manifest.json > "$RUNNER_TEMP/manifest.json"
          git show HEAD:.github/macro02-qa/run-active-r7-pg.sh > "$RUNNER_TEMP/macro02-active-pg17.sh"
          test "$(git hash-object "$RUNNER_TEMP/macro02-active-pg17.sh")" = e73e56fd60ddc102f3705f382a9e4fe8539e14fd
          git checkout --detach HEAD^
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY_VERIFY'
          import json,subprocess,sys
          manifest=json.load(open(sys.argv[1]))
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted(manifest),(changed,manifest.keys())
          for p,item in manifest.items():
              assert subprocess.check_output(['git','hash-object',p],text=True).strip()==item['new'],p
          PY_VERIFY
          git diff --check HEAD^ HEAD
          test "$(git hash-object scripts/macro02-activation-lab/migration-03-r6-candidate.sql)" = 35cf3d9f7ec2f549ba1cf115f5325d23b127c15f
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias exatas
        id: install
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL 17 - Migration 03 e Premium ativo
        run: bash "$RUNNER_TEMP/macro02-active-pg17.sh"
      - name: Limites
        if: always()
        run: echo 'PG17 isolado; sem producao; nao certifica UI nem dispositivo fisico.'
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fonte imutavel e delta exclusivo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/vault-lab/macro02-final-integrated-r9-* ]]
          test "$(git rev-parse HEAD^^)" = 141b82843baeb94b599c8ac2578ba1ac3094c1d7
          test "$(git rev-parse HEAD~2^{tree})" = af8f0153c71ca569b958626cbe72ce0025f74f3b
          test "$(cat vercel.json)" = '{"ignoreCommand":"exit 0"}'
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/macro02-qa/final-r9-manifest.json .github/macro02-qa/run-active-r7-pg.sh .github/workflows/macro02-final-integrated-r9.yml vercel.json | LC_ALL=C sort)"
          git show HEAD:.github/macro02-qa/final-r9-manifest.json > "$RUNNER_TEMP/manifest.json"
          git show HEAD:.github/macro02-qa/run-active-r7-pg.sh > "$RUNNER_TEMP/macro02-active-pg17.sh"
          test "$(git hash-object "$RUNNER_TEMP/macro02-active-pg17.sh")" = e73e56fd60ddc102f3705f382a9e4fe8539e14fd
          git checkout --detach HEAD^
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY_VERIFY'
          import json,subprocess,sys
          manifest=json.load(open(sys.argv[1]))
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          assert sorted(changed)==sorted(manifest),(changed,manifest.keys())
          for p,item in manifest.items():
              assert subprocess.check_output(['git','hash-object',p],text=True).strip()==item['new'],p
          PY_VERIFY
          git diff --check HEAD^ HEAD
          test "$(git hash-object scripts/macro02-activation-lab/migration-03-r6-candidate.sql)" = 35cf3d9f7ec2f549ba1cf115f5325d23b127c15f
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias exatas
        id: install
        run: npm ci --no-audit --no-fund
      - name: TypeScript integral
        run: npx --no-install tsc --noEmit
      - name: V63 integral e V70 - sem excluir contratos
        if: always() && steps.install.outcome == 'success'
        env:
          VAULT_V63_COLLECT_ALL: '1'
        run: node scripts/test-v63-release-gate.mjs
      - name: Limites
        if: always()
        run: echo 'Gates sobre nova arvore. Nao substitui certificacao UI Premium real. Sem deploy, sem APK e sem SQL produtivo.'
