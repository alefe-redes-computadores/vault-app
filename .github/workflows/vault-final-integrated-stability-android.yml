          node scripts/test-vault-stability-h05-h06.cjs 2>&1 | tee -a "$e/directed.log" || failures=$((failures+1))
          node scripts/test-vault-stability-h07.cjs 2>&1 | tee -a "$e/directed.log" || failures=$((failures+1))
