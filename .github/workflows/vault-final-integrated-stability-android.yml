          "$RUNNER_TEMP/h01-browser/bin/python" "$RUNNER_TEMP/qa_h01_h04.py" --phase after --out out --evidence "$e" --sha 'cc6f84ad60ffaae42b9f8e897afa421b437fff86' --baseline "$RUNNER_TEMP/h01-h07-evidence/before/measurements.json" --day "$(cat "$RUNNER_TEMP/h01-h07-evidence/day.txt")" 2>&1 | tee "$e/chromium.log" || failures=$((failures+1))
          "$RUNNER_TEMP/h01-browser/bin/python" "$RUNNER_TEMP/qa_h05_h06.py" --phase after --out out --evidence "$e" --sha 'cc6f84ad60ffaae42b9f8e897afa421b437fff86' --day "$(cat "$RUNNER_TEMP/h01-h07-evidence/day.txt")" 2>&1 | tee "$e/chromium-h05-h06.log" || failures=$((failures+1))
          printf 'FAILED_CHECKS=%s\n' "$failures" | tee "$e/collection-status.txt"
          test "$failures" -eq 0
