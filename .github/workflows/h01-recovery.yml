name: VAULT H01 — geometria real de Medicamentos
on:
  push:
    branches: [main, guardian/stability-residual-closure-20261128]
    paths:
      - 'app/saude/medicamentos/page.tsx'
      - 'app/globals.css'
      - 'lib/medications/regulatory-copy-ux360.ts'
      - 'lib/navigation/bottom-nav-compose.ts'
      - 'components/BottomNav.tsx'
      - 'components/saude/MedicationOperationalStrip.tsx'
      - 'scripts/h01-recovery/**'
      - 'scripts/test-vault-m64-premium-performance.cjs'
      - '.github/workflows/h01-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vault-h01-geometry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/guardian/stability-residual-closure-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8765
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-not-a-production-key
      CAPACITOR_BUILD: '0'
      VAULT_WEB_STATIC_BUILD: '1'
      NEXT_PUBLIC_VAULT_NATIVE_RUNTIME: web
      BASE: '5d76df41dfae7f2c3607eb18454aa5bf6fe64afd'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Pin baseline and preserve evidence directories
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE^{tree}")" = 3817f3b2ddd7b9f7d6d8dbd9d9769642476cad27
          git merge-base --is-ancestor "$BASE" HEAD
          git worktree add --detach "$RUNNER_TEMP/h01-before" "$BASE"
          mkdir -p "$RUNNER_TEMP/h01-evidence/before" "$RUNNER_TEMP/h01-evidence/after"
          date +%F > "$RUNNER_TEMP/h01-evidence/day.txt"
          git diff --stat "$BASE" HEAD > "$RUNNER_TEMP/h01-evidence/delta.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/h01-evidence/candidate.txt"
      - name: Install real Chromium
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/h01-browser"
          "$RUNNER_TEMP/h01-browser/bin/pip" install --disable-pip-version-check playwright==1.57.0
          "$RUNNER_TEMP/h01-browser/bin/python" -m playwright install --with-deps chromium
      - name: Baseline — actual Web export and geometry
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/h01-before"
          E="$RUNNER_TEMP/h01-evidence/before"
          npm ci --no-audit --no-fund 2>&1 | tee "$E/npm.log"
          npm run build 2>&1 | tee "$E/build.log"
          node scripts/verify-static-release-stability.cjs web 2>&1 | tee "$E/static.log"
          "$RUNNER_TEMP/h01-browser/bin/python" "$GITHUB_WORKSPACE/scripts/h01-recovery/qa_h01_recovery.py" --phase before --out out --evidence "$E" --sha "$BASE" --day "$(cat "$RUNNER_TEMP/h01-evidence/day.txt")" 2>&1 | tee "$E/chromium.log"
      - name: Candidate — actual export and no-downgrade geometry
        if: ${{ !cancelled() && (steps.baseline.outcome == 'success' || steps.baseline.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/h01-evidence/after"
          npm ci --no-audit --no-fund 2>&1 | tee "$E/npm.log"
          node scripts/test-vault-m136-visual-navigation.cjs 2>&1 | tee "$E/m136.log"
          node scripts/test-vault-stability-h01-h04.cjs 2>&1 | tee "$E/directed.log"
          npm run build 2>&1 | tee "$E/build.log"
          node scripts/verify-static-release-stability.cjs web 2>&1 | tee "$E/static.log"
          "$RUNNER_TEMP/h01-browser/bin/python" scripts/h01-recovery/qa_h01_recovery.py --phase after --out out --evidence "$E" --sha "$GITHUB_SHA" --baseline "$RUNNER_TEMP/h01-evidence/before/measurements.json" --day "$(cat "$RUNNER_TEMP/h01-evidence/day.txt")" 2>&1 | tee "$E/chromium.log"
      - name: Preserve visual proof, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Vault-H01-recovery-real-Chromium
          path: ${{ runner.temp }}/h01-evidence/
          if-no-files-found: error
          retention-days: 30
  guardian-full-gate:
    # This additional gate is isolated to the candidate branch, never a release/promotion.
    if: github.ref == 'refs/heads/guardian/stability-residual-closure-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      VAULT_V63_COLLECT_ALL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned base and exact allowed delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c1094d1b1cfe79303850fbb7f7de5841da71408 HEAD
          git diff --check 1c1094d1b1cfe79303850fbb7f7de5841da71408 HEAD
          actual="$(git diff --name-only 1c1094d1b1cfe79303850fbb7f7de5841da71408 HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/h01-recovery.yml' 'scripts/h01-recovery/qa_h01_recovery.py' 'scripts/test-vault-m64-premium-performance.cjs' 'app/saude/medicamentos/page.tsx' | sort)"
          test "$actual" = "$expected"
          git rev-parse HEAD HEAD^{tree}
      - run: npm ci --no-audit --no-fund
      - name: Directed M64, V63 integral and V70
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p guardian-gate-evidence
          status=0
          node scripts/test-vault-m64-premium-performance.cjs 2>&1 | tee guardian-gate-evidence/m64.log || status=1
          node scripts/test-vault-residual-consumers.cjs 2>&1 | tee guardian-gate-evidence/residual.log || status=1
          if ! node scripts/test-v63-release-gate.mjs 2>&1 | tee guardian-gate-evidence/v63.log; then
            status=1
            # On failure collect both V70 diagnoses independently; on success V63 already ran both.
            node scripts/test-v70-super-integrity-ux-contract.mjs 2>&1 | tee guardian-gate-evidence/v70-super.log || status=1
            node scripts/test-v70-final-completeness-contract.mjs 2>&1 | tee guardian-gate-evidence/v70-final.log || status=1
          fi
          node node_modules/typescript/bin/tsc --noEmit 2>&1 | tee guardian-gate-evidence/typescript.log || status=1
          exit "$status"
      - name: Preserve gate evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Vault-Guardian-closure-full-gate
          path: guardian-gate-evidence/
          if-no-files-found: error
          retention-days: 30
