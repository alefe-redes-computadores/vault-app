name: VAULT Fast Lane — candidato protegido

on:
  push:
    branches:
      - 'vault/fastlane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-fastlane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: V63 + V70 + TypeScript — diagnóstico agregado
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do candidato isolado
        uses: actions/checkout@v4
      - name: Node 22 e cache de dependências
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalação reproduzível
        run: npm ci
      - name: Gate integral sem parar na primeira falha
        id: gate
        run: node scripts/fastlane-aggregate-release-m150-p3.cjs
        env:
          VAULT_FASTLANE_REPORT: ${{ runner.temp }}/vault-fastlane-diagnostico.txt
      - name: Resumo verificável
        if: always()
        shell: bash
        run: |
          {
            echo '## VAULT Fast Lane — candidato'
            echo "- Commit candidato: $GITHUB_SHA"
            echo '- V63 + V70 + TypeScript: conferir resultado do job'
            echo '- APK: NÃO compilado/publicado neste workflow'
            echo '- Main/produção: NÃO alteradas pelo workflow'
            if test -f "$RUNNER_TEMP/vault-fastlane-diagnostico.txt"; then
              echo '### Diagnóstico'
              echo '```'
              cat "$RUNNER_TEMP/vault-fastlane-diagnostico.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Anexar diagnóstico sem dados clínicos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-fastlane-diagnostico
          path: ${{ runner.temp }}/vault-fastlane-diagnostico.txt
          if-no-files-found: ignore
          retention-days: 7
