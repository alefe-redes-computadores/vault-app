name: VAULT Stability V56 reconciliation final registry - NO RELEASE
on:
  push:
    branches: ['vault-lab/stability-r04-v56-final-03ec3c50']
permissions:
  contents: read
  actions: read
concurrency:
  group: vault-stability-r04-v56-final
  cancel-in-progress: false
jobs:
  accepted-delta:
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful exact delta run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/46011015272 > "$RUNNER_TEMP/delta.json"
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="2fb0b5a09debad6e9478fd028651778ae1cea560"' "$RUNNER_TEMP/delta.json"
          gh api repos/${{ github.repository }}/actions/runs/46011015272/jobs > "$RUNNER_TEMP/jobs.json"
          jq -e '([.jobs[]|select(.name=="cas-delta" and .conclusion=="success")]|length)==1 and ([.jobs[]|select(.name=="chromium" and .conclusion=="success")]|length)==1' "$RUNNER_TEMP/jobs.json"
          gh api repos/${{ github.repository }}/actions/runs/46012889556 > "$RUNNER_TEMP/previous-final.json"
          jq -e '.status=="completed" and .head_sha=="47bee0a0c07e183d61378ca290bc443dd0e65b23"' "$RUNNER_TEMP/previous-final.json"
          gh api repos/${{ github.repository }}/actions/runs/46012889556/jobs > "$RUNNER_TEMP/previous-jobs.json"
          jq -e '([.jobs[]|select(.name=="android-debug" and .conclusion=="success")]|length)==1 and ([.jobs[]|select(.name=="accepted-delta" and .conclusion=="success")]|length)==1' "$RUNNER_TEMP/previous-jobs.json"
  v63-final:
    needs: accepted-delta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-not-a-production-key
      VAULT_V63_COLLECT_ALL: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin consolidated candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf'
          test "$(git rev-parse 'c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf^{tree}')" = '7118bf620afe2107e3faf9736e7a741a4a3c345d'
          test "$(git rev-parse 'c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf^')" = '03ec3c5014256fa754a7459e39e090f89af1c8f7'
          test "$(git diff --name-only '03ec3c5014256fa754a7459e39e090f89af1c8f7' 'c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf')" = 'scripts/test-v56-final-stability-contract.mjs'
          git checkout --detach 'c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf'
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/stability-final"
          printf 'CANDIDATE=%s\nTREE=%s\nDELTA_RUN=46011015272\nPRODUCTION=LOCKED\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/stability-final/status.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Final mandatory release registry, no suite removed
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stability-final"
          npm ci --no-audit --no-fund 2>&1 | tee "$d/npm.log"
          node scripts/test-v56-final-stability-contract.mjs 2>&1 | tee "$d/v56-directed.log"
          set +e
          node scripts/test-v63-release-gate.mjs 2>&1 | tee "$d/v63.log"
          a=("${PIPESTATUS[@]}")
          set -e
          test "${a[0]}" = 0 && test "${a[1]}" = 0
          for marker in 'V63_COLETA_INTEGRAL_APROVADA | executadas=581 | falhas=0' 'STATIC_OFFLINE_CONTRACTS=69/69 PASS' 'R03_IDENTITY_PASS=49 FAIL=0' 'CAS_TRANSPORT_TOTAL=20' 'STB13_GEOMETRY_BEHAVIOR_PASS=29' 'STB_DIRECTED_PASS=173 FAIL=0' 'V56_R04_CONTEXTUAL_RETURN_PASS=14'; do
            grep -Fq "$marker" "$d/v63.log"
          done
          echo FINAL_V63_PASS >> "$d/status.txt"
      - name: Final V70 mandatory contracts
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stability-final"
          node scripts/test-v70-super-integrity-ux-contract.mjs 2>&1 | tee "$d/v70-super.log"
          node scripts/test-v70-final-completeness-contract.mjs 2>&1 | tee "$d/v70-final.log"
      - name: Evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stability-final-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/stability-final/
          if-no-files-found: error
          retention-days: 30

