name: VAULT Residual R5 - Chromium targeted 4 - NO RELEASE
on:
  push:
    branches: ['vault-lab/residual-browser-targeted-1bd868d24b06']
permissions:
  contents: read
concurrency:
  group: vault-residual-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8765
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-not-a-production-key
      CAPACITOR_BUILD: '0'
      VAULT_WEB_STATIC_BUILD: '1'
      NEXT_PUBLIC_VAULT_NATIVE_RUNTIME: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate QA code and pin exact R5 tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/residual-browser"
          test "$(git rev-parse HEAD^)" = '1bf5c915518590d676bdd3bc61623c2dec9c59de'
          test "$(git rev-parse '1bf5c915518590d676bdd3bc61623c2dec9c59de^{tree}')" = '96ef70fa991996d0e44d5028202b644854b80403'
          cp .github/residual-qa/qa_browser.py "$RUNNER_TEMP/qa_browser.py"
          test "$(sha256sum "$RUNNER_TEMP/qa_browser.py" | cut -d' ' -f1)" = 'e4aae9445f3b785be2f7c85b19e1b871720834fdc90922b7ec133041a40ddc15'
          git checkout --detach '1bf5c915518590d676bdd3bc61623c2dec9c59de'
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'CANDIDATE=%s\nTREE=%s\nPUBLICATION=LOCKED\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/residual-browser/status.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Build exact Web export with synthetic loopback configuration
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/residual-browser/npm-ci.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/residual-browser/build.log"
          node scripts/verify-static-release-stability.cjs web 2>&1 | tee "$RUNNER_TEMP/residual-browser/static.log"
          grep -Fq 'STATIC_EXPORT=WEB_PASS' "$RUNNER_TEMP/residual-browser/static.log"
      - name: Install pinned Chromium test tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install --disable-pip-version-check playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Real browser, four residual failures only, local synthetic data
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/browser-venv/bin/python" "$RUNNER_TEMP/qa_browser.py" --out out --sha '1bf5c915518590d676bdd3bc61623c2dec9c59de' --evidence "$RUNNER_TEMP/residual-browser" 2>&1 | tee "$RUNNER_TEMP/residual-browser/chromium.log"
      - name: Only sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: residual-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/residual-browser/
          if-no-files-found: error
          retention-days: 7
