name: Compilar APK Vault

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Executar gate canônico de release V63
        run: npm run test:release
      - name: Exportar aplicação para o Capacitor
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:export

      - name: Confirmar exportação
        run: test -f out/index.html

      - name: Criar plataforma Android
        run: |
          if test -d android; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Configurar deep link de autenticação
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()
          activity = next(
              item for item in root.findall("./application/activity")
              if item.get(f"{{{android}}}name", "").endswith("MainActivity")
          )
          exists = any(
              data.get(f"{{{android}}}scheme") == "vault"
              and data.get(f"{{{android}}}host") == "callback"
              for data in activity.findall("./intent-filter/data")
          )
          if not exists:
              intent = ET.SubElement(activity, "intent-filter", {
                  f"{{{android}}}label": "vault_auth",
              })
              ET.SubElement(intent, "action", {
                  f"{{{android}}}name": "android.intent.action.VIEW",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.DEFAULT",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.BROWSABLE",
              })
              ET.SubElement(intent, "data", {
                  f"{{{android}}}scheme": "vault",
                  f"{{{android}}}host": "callback",
              })
              tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Gerar identidade visual Android
        run: |
          test -f assets/icon.png
          test -f assets/splash.png
          npx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Validar bridge e plugins nativos V29
        run: node scripts/validate-android-bridge-v29.mjs

      - name: Aplicar edge-to-edge nativo
        run: node scripts/patch-android-edge-to-edge-v28.mjs
      - name: Instalar ícone de notificações Android
        run: |
          test -f assets/android/ic_stat_vault.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_vault.xml android/app/src/main/res/drawable/ic_stat_vault.xml

      - name: Restaurar assinatura Android estável e versionar APK
        shell: bash
        env:
          VAULT_DEBUG_KEYSTORE_BASE64: ${{ secrets.VAULT_DEBUG_KEYSTORE_BASE64 }}
          VAULT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$VAULT_DEBUG_KEYSTORE_BASE64" || { echo "ERRO: secret VAULT_DEBUG_KEYSTORE_BASE64 ausente." >&2; exit 1; }
          test "$VAULT_VERSION_CODE" -ge 1

          KEYSTORE="$RUNNER_TEMP/vault-debug.keystore"
          printf '%s' "$VAULT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android >/dev/null

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          version_code = os.environ["VAULT_VERSION_CODE"]

          text, count = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              rf"\g<1>versionCode {version_code}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("V86: versionCode não encontrado no Gradle.")

          if "vaultStableDebug" in text:
              raise SystemExit("V86: contrato de assinatura duplicado.")

          block = r"""

          // Vault V86: assinatura debug permanente para atualizações sobre o APK instalado.
          android {
              signingConfigs {
                  vaultStableDebug {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/vault-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.vaultStableDebug
                  }
              }
          }
          """
          path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY

          grep -F "versionCode $VAULT_VERSION_CODE" android/app/build.gradle
          grep -F 'vaultStableDebug' android/app/build.gradle
          grep -F 'vault-debug.keystore' android/app/build.gradle

          echo "===== CERTIFICADO PERMANENTE DO VAULT ====="
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'Alias name:|SHA1:|SHA256:'
          echo "============================================"

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Validar identidade e versão do APK
        shell: bash
        env:
          VAULT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$RUNNER_TEMP/vault-debug.keystore"
          test -s "$APK"
          test -s "$KEYSTORE"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          EXPECTED_SHA256="$(keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERTS"
          ACTUAL_SHA256="$(printf '%s\n' "$CERTS" | sed -nE '/[Ss][Hh][Aa]-256[[:space:]]+[Dd][Ii][Gg][Ee][Ss][Tt]:/ { s/^.*:[[:space:]]*//; p; q; }' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || { echo "ERRO: APK assinado com certificado inesperado." >&2; exit 1; }

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" | head -n 1)"
          test "$ACTUAL_VERSION_CODE" = "$VAULT_VERSION_CODE" || { echo "ERRO: versionCode real diverge do github.run_number." >&2; exit 1; }

          echo "ASSINATURA E VERSIONCODE DO VAULT VALIDADOS."


      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vault-App-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
