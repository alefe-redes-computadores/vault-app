      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias exatas
        id: install
        run: npm ci --no-audit --no-fund
      - name: TypeScript integral
        run: npx --no-install tsc --noEmit
      - name: Teste residual de recuperacao com Dexie real
        run: node --require ./scripts/vault-m2-test-alias-preload.cjs scripts/test-vault-macro02-restore-staging.cjs
      - name: V63 integral e V70 - sem excluir contratos
        if: success()
        env:
          VAULT_V63_COLLECT_ALL: '1'
        run: |
          set -euo pipefail
          node scripts/test-v63-release-gate.mjs | tee "$RUNNER_TEMP/v63-unified.log"
          grep -Fq 'V63_COLETA_INTEGRAL_APROVADA | executadas=591 | falhas=0' "$RUNNER_TEMP/v63-unified.log"
          node scripts/test-v70-super-integrity-ux-contract.mjs
          node scripts/test-v70-final-completeness-contract.mjs
      - name: Preservar log V63 unificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Unified-V63-contracts
          path: ${{ runner.temp }}/v63-unified.log
          if-no-files-found: warn
      - name: Limites
        if: always()
        run: echo 'Gates sobre nova arvore. Nao substitui certificacao UI Premium real. Sem deploy, sem APK e sem SQL produtivo.'
