name: Compilar APK Vault

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar versões e TypeScript
        run: |
          npm run check:versions
          node node_modules/typescript/bin/tsc --noEmit

      - name: Executar contratos pré-APK
        run: |
          node scripts/test-pre-apk-v25-contract.mjs
          node scripts/test-v22-v24-contract.mjs
          node scripts/test-v19-v21-contract.mjs
          node scripts/test-contas-cartoes-credenciais-v18-contract.mjs
          node scripts/test-cadastro-medicamento-v17-contract.mjs
          node scripts/test-seguranca-regulatoria-v16-contract.mjs

      - name: Executar contrato V28
        run: node scripts/test-v28-perfis-edge-to-edge-contract.mjs

      - name: Executar contrato V29
        run: node scripts/test-v29-native-runtime-contract.mjs

      - name: Executar contrato V30.2
        run: node scripts/test-v30-2-native-contract.mjs
      - name: Exportar aplicação para o Capacitor
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:export

      - name: Confirmar exportação
        run: test -f out/index.html

      - name: Criar plataforma Android
        run: |
          if test -d android; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Configurar deep link de autenticação
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()
          activity = next(
              item for item in root.findall("./application/activity")
              if item.get(f"{{{android}}}name", "").endswith("MainActivity")
          )
          exists = any(
              data.get(f"{{{android}}}scheme") == "vault"
              and data.get(f"{{{android}}}host") == "callback"
              for data in activity.findall("./intent-filter/data")
          )
          if not exists:
              intent = ET.SubElement(activity, "intent-filter", {
                  f"{{{android}}}label": "vault_auth",
              })
              ET.SubElement(intent, "action", {
                  f"{{{android}}}name": "android.intent.action.VIEW",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.DEFAULT",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.BROWSABLE",
              })
              ET.SubElement(intent, "data", {
                  f"{{{android}}}scheme": "vault",
                  f"{{{android}}}host": "callback",
              })
              tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Gerar identidade visual Android
        run: |
          test -f assets/icon.png
          test -f assets/splash.png
          npx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Validar bridge e plugins nativos V29
        run: node scripts/validate-android-bridge-v29.mjs

      - name: Aplicar edge-to-edge nativo
        run: node scripts/patch-android-edge-to-edge-v28.mjs
      - name: Instalar ícone de notificações Android
        run: |
          test -f assets/android/ic_stat_vault.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_vault.xml android/app/src/main/res/drawable/ic_stat_vault.xml

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vault-App-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
