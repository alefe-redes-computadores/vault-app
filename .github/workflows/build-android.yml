name: VAULT Stability H01-H07 FINAL - SEM RELEASE

on:
  push:
    branches: ["vault-lab/stability-h01-h07-r3-v63-32f4c66e"]

permissions:
  contents: read
  actions: read

concurrency:
  group: vault-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    needs: [chromium-delta]
    name: Validar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historical audit optional; strict V63 executes the current tree

      - name: Fixar origem do delta e proibir release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE='b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0'
          PREVIOUS='b40d302ac4594eac60c3929a6c4f0ca855e0a5fa'
          BASELINE='c80de7180ce77fd30c8cc1fc104bdb8bf1f1bdcf'
          test "$GITHUB_REF_NAME" = 'vault-lab/stability-h01-h07-r3-v63-32f4c66e'
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git rev-parse "$SOURCE^{tree}")" = '80e329b57db6504488ea8929dd80ddb73e40adbe'
          test "$(git rev-parse "$SOURCE^")" = '32f4c66ea6a3d533e0fe076083470cc88a53e99c'
          test "$(git rev-parse "$SOURCE^^")" = '67ea5ef1706d6864e65c51d9cd83905abf393cbe'
          test "$(git rev-parse "$SOURCE^^^")" = 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3'
          test "$(git rev-parse '32f4c66ea6a3d533e0fe076083470cc88a53e99c^{tree}')" = 'c11b99467261a7aa4cfb9ba61b7870e657131b49'
          test "$(git diff --name-only '32f4c66ea6a3d533e0fe076083470cc88a53e99c' "$SOURCE" -- . ':!scripts/test-*.cjs')" = ""
          test "$(git rev-parse '67ea5ef1706d6864e65c51d9cd83905abf393cbe^{tree}')" = '447a64da793c71b210a5e6d8dabb3386cfc0b787'
          test "$(git rev-parse 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3^')" = "$PREVIOUS"
          test "$(git rev-parse 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3^{tree}')" = '2f1feb9245fd4f5813e9f0c78a5bfc5139214fc0'
          test "$(git rev-parse "$PREVIOUS^")" = "$BASELINE"
          test "$(git rev-parse "$BASELINE^{tree}")" = '7118bf620afe2107e3faf9736e7a741a4a3c345d'
          test "$(git rev-parse "$SOURCE:supabase/migrations/20261127152804_vault_stb11_visual_cas_r04.sql")" = '3d8ea7ad33ecad3d37f3344257dea3293b518dc7'
          test "$(sha256sum .github/h01-h07/source-files.txt | cut -d' ' -f1)" = 'fbb23381add28239f14dcb949b4d032d213612d787be13f616ff804b1e2e94fc'
          test "$(git diff --name-only 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3' "$SOURCE")" = "$(cat .github/h01-h07/source-files.txt)"
          test "$(git diff --name-only "$SOURCE" HEAD)" = "$(printf '%s\n' .github/h01-h07/h07-copy.json .github/h01-h07/qa_browser.py .github/h01-h07/qa_h01_h04.py .github/h01-h07/qa_h05_h06.py .github/h01-h07/source-files.txt .github/workflows/build-android.yml vercel.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46015710107" --jq '.conclusion + " " + .head_sha' | grep -Fx 'success 6adc43f0a67c3036d5a2848ecacd3bca850f735a'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46025982841" --jq '.conclusion + " " + .head_sha' | grep -Fx 'success dfd108d2678f5f00dae162efd9189ada69d3c81d'
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$latest" =~ ^vault-android-b([0-9]+)$ ]]
          last_build="${BASH_REMATCH[1]}"
          test "$GITHUB_RUN_NUMBER" -gt "$last_build"
          git checkout --detach "$SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p artifacts
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\nLAB_SHA=%s\nVERSION_CODE=%s\nPRODUCTION_RELEASE=NO\nCAS_ALREADY_APPLIED=20261127152804\n' "$SOURCE" "$(git rev-parse HEAD^{tree})" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > artifacts/STABILITY-H01-H07-ORIGEM.txt
          cat artifacts/STABILITY-H01-H07-ORIGEM.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Executar gate V63 estrito e TypeScript integral
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          failures=0
          VAULT_V63_COLLECT_ALL=1 npm run test:release 2>&1 | tee artifacts/V63-STRICT.log || failures=$((failures+1))
          for marker in 'V63_COLETA_INTEGRAL_APROVADA | executadas=584 | falhas=0' 'STATIC_OFFLINE_CONTRACTS=69/69 PASS' 'R03_IDENTITY_PASS=49 FAIL=0' 'CAS_TRANSPORT_TOTAL=20' 'STB13_GEOMETRY_BEHAVIOR_PASS=29' 'STB_DIRECTED_PASS=173 FAIL=0' 'V56_R04_CONTEXTUAL_RETURN_PASS=14' 'H01_H04_DIRECTED_PASS=' 'H05_H06_DIRECTED_PASS=' 'H07_DIRECTED_PASS='; do
            grep -Fq "$marker" artifacts/V63-STRICT.log || { printf "MISSING_GATE_MARKER=%s\n" "$marker"; failures=$((failures+1)); }
          done
          node scripts/test-v70-super-integrity-ux-contract.mjs 2>&1 | tee artifacts/V70-SUPER.log || failures=$((failures+1))
          node scripts/test-v70-final-completeness-contract.mjs 2>&1 | tee artifacts/V70-FINAL.log || failures=$((failures+1))
          node scripts/test-vault-update360-v34.cjs 2>&1 | tee artifacts/UPDATE360.log || failures=$((failures+1))
          node node_modules/typescript/bin/tsc --noEmit 2>&1 | tee artifacts/TYPESCRIPT.log || failures=$((failures+1))
          printf "FINAL_GATE_FAILURES=%s\n" "$failures" | tee artifacts/FINAL-GATE-STATUS.txt
          test "$failures" -eq 0
      - name: Exportar aplicação para o Capacitor
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/ci-build-export-resilient.cjs

      - name: Confirmar exportação
        run: test -f out/index.html

      - name: Criar plataforma Android
        run: |
          if test -d android; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Configurar deep link de autenticação
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()
          activity = next(
              item for item in root.findall("./application/activity")
              if item.get(f"{{{android}}}name", "").endswith("MainActivity")
          )
          exists = any(
              data.get(f"{{{android}}}scheme") == "vault"
              and data.get(f"{{{android}}}host") == "callback"
              for data in activity.findall("./intent-filter/data")
          )
          if not exists:
              intent = ET.SubElement(activity, "intent-filter", {
                  f"{{{android}}}label": "vault_auth",
              })
              ET.SubElement(intent, "action", {
                  f"{{{android}}}name": "android.intent.action.VIEW",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.DEFAULT",
              })
              ET.SubElement(intent, "category", {
                  f"{{{android}}}name": "android.intent.category.BROWSABLE",
              })
              ET.SubElement(intent, "data", {
                  f"{{{android}}}scheme": "vault",
                  f"{{{android}}}host": "callback",
              })
              tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Gerar identidade visual Android
        run: |
          test -f assets/icon.png
          test -f assets/splash.png
          npx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Validar bridge e plugins nativos V29
        run: node scripts/validate-android-bridge-v29.mjs

      - name: Aplicar edge-to-edge nativo
        run: node scripts/patch-android-edge-to-edge-v28.mjs
      - name: Configurar Health Connect e validar ferramentas Android
        run: node scripts/patch-android-health-connect-v113.mjs

      - name: Configurar alarmes exatos M99 com autorização especial
        run: node scripts/patch-android-exact-alarms-m99.mjs

      - name: Integrar atualização nativa segura M111
        run: |
          node scripts/apply-android-native-updater-m111.mjs
          node scripts/check-android-native-updater-m111.mjs

      - name: Instalar ícone de notificações Android
        run: |
          test -f assets/android/ic_stat_vault.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_vault.xml android/app/src/main/res/drawable/ic_stat_vault.xml

      - name: Restaurar assinatura Android estável e versionar APK
        shell: bash
        env:
          VAULT_DEBUG_KEYSTORE_BASE64: ${{ secrets.VAULT_DEBUG_KEYSTORE_BASE64 }}
          VAULT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$VAULT_DEBUG_KEYSTORE_BASE64" || { echo "ERRO: secret VAULT_DEBUG_KEYSTORE_BASE64 ausente." >&2; exit 1; }
          test "$VAULT_VERSION_CODE" -ge 1
          VAULT_APP_VERSION="$(node -p 'require("./package.json").version')"
          export VAULT_APP_VERSION
          test -n "$VAULT_APP_VERSION"

          KEYSTORE="$RUNNER_TEMP/vault-debug.keystore"
          printf '%s' "$VAULT_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android >/dev/null

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          version_code = os.environ["VAULT_VERSION_CODE"]

          text, count = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              rf"\g<1>versionCode {version_code}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("V86: versionCode não encontrado no Gradle.")

          version_name = os.environ["VAULT_APP_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version_name):
              raise SystemExit("M87: versão semântica inválida")
          text, vn_count = re.subn(
              r'(?m)^(\s*)versionName\s+"[^"]+"\s*$',
              rf'\g<1>versionName "{version_name}"',
              text, count=1,
          )
          if vn_count != 1:
              raise SystemExit("M87: versionName não encontrada no Gradle")

          if "vaultStableDebug" in text:
              raise SystemExit("V86: contrato de assinatura duplicado.")

          block = r"""

          // Vault V86: assinatura debug permanente para atualizações sobre o APK instalado.
          android {
              signingConfigs {
                  vaultStableDebug {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/vault-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.vaultStableDebug
                  }
              }
          }
          """
          path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY

          grep -F "versionCode $VAULT_VERSION_CODE" android/app/build.gradle
          grep -F "versionName \"$VAULT_APP_VERSION\"" android/app/build.gradle
          grep -F 'vaultStableDebug' android/app/build.gradle
          grep -F 'vault-debug.keystore' android/app/build.gradle

          echo "===== CERTIFICADO PERMANENTE DO VAULT ====="
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'Alias name:|SHA1:|SHA256:'
          echo "============================================"

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Validar identidade e versão do APK
        shell: bash
        env:
          VAULT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$RUNNER_TEMP/vault-debug.keystore"
          test -s "$APK"
          test -s "$KEYSTORE"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          EXPECTED_SHA256="$(keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERTS"
          ACTUAL_SHA256="$(printf '%s\n' "$CERTS" | sed -nE '/[Ss][Hh][Aa]-256[[:space:]]+[Dd][Ii][Gg][Ee][Ss][Tt]:/ { s/^.*:[[:space:]]*//; p; q; }' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256" || { echo "ERRO: APK assinado com certificado inesperado." >&2; exit 1; }

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          VAULT_APP_VERSION="$(node -p 'require("./package.json").version')"
          ACTUAL_VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" | head -n 1)"
          test "$ACTUAL_VERSION_NAME" = "$VAULT_APP_VERSION" || { echo "ERRO: versionName real diverge do package.json" >&2; exit 1; }
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -nE "s/^package:.*versionCode='([0-9]+)'.*/\1/p" | head -n 1)"
          test "$ACTUAL_VERSION_CODE" = "$VAULT_VERSION_CODE" || { echo "ERRO: versionCode real diverge do github.run_number." >&2; exit 1; }

          echo "ASSINATURA E VERSIONCODE DO VAULT VALIDADOS."


      # M67: This summary appears only if the prior gate, export, build and
      # signed-APK/versionCode verification have succeeded. No medical data.
      - name: Certificação M67 — resumo da homologação Android
        if: success()
        shell: bash
        run: |
          {
            echo '## VAULT M67 · Build Android com gate V63 estrito (APK ainda requer homologação física)'
            echo "- Commit de origem: $(git rev-parse HEAD)"
            echo "- Commit isolado de CI: ${GITHUB_SHA}"
            echo "- Execução: ${GITHUB_RUN_ID}"
            echo '- Gate canônico V63 estrito e TypeScript integral aprovados'
            echo '- Exportação, bridge, build e certificado/versionCode: aprovados'
            echo '- Artefato APK: Vault-App-debug (conferir etapa seguinte)'
            echo '- Teste de instalação e sincronização PWA × APK: pendente de homologação manual'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vault-App-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Preservar relatório integral do gate V63 estrito
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vault-V63-Strict-Audit
          path: artifacts/V63-STRICT.log
          if-no-files-found: warn
          retention-days: 14

      - name: Preservar origem e V70 do APK de homologacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vault-Stability-H01-H07-Origem-V70
          path: |
            artifacts/STABILITY-H01-H07-ORIGEM.txt
            artifacts/V70-SUPER.log
            artifacts/V70-FINAL.log
            artifacts/UPDATE360.log
            artifacts/TYPESCRIPT.log
            artifacts/FINAL-GATE-STATUS.txt
          if-no-files-found: error
          retention-days: 14

      # Publicação foi deslocada para promote-android-run.yml:
      # workflow_run completed SUCCESS + Environment protegido + revalidação do artefato original.
      # Não publicar de dentro do job de compilação; o estado da Action ainda não é completed.

  chromium-delta:
    name: H01-H07 Chromium antes e depois (loopback)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: 'true'
      TZ: America/Sao_Paulo
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8765
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-synthetic-not-a-production-key
      CAPACITOR_BUILD: '0'
      VAULT_WEB_STATIC_BUILD: '1'
      NEXT_PUBLIC_VAULT_NATIVE_RUNTIME: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Pin source and exact previous native candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0'
          test "$(git rev-parse 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0^{tree}')" = '80e329b57db6504488ea8929dd80ddb73e40adbe'
          test "$(git rev-parse 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0^')" = '32f4c66ea6a3d533e0fe076083470cc88a53e99c'
          test "$(git rev-parse 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0^^')" = '67ea5ef1706d6864e65c51d9cd83905abf393cbe'
          test "$(git rev-parse 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0^^^')" = 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3'
          test "$(git rev-parse '32f4c66ea6a3d533e0fe076083470cc88a53e99c^{tree}')" = 'c11b99467261a7aa4cfb9ba61b7870e657131b49'
          test "$(git diff --name-only '32f4c66ea6a3d533e0fe076083470cc88a53e99c' 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0' -- . ':!scripts/test-*.cjs')" = ""
          test "$(git rev-parse '67ea5ef1706d6864e65c51d9cd83905abf393cbe^{tree}')" = '447a64da793c71b210a5e6d8dabb3386cfc0b787'
          test "$(git rev-parse 'd9dcb9db533e260b4320cccb1c79cadbeb9045b3^')" = 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa'
          test "$(git rev-parse 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa^{tree}')" = '74ea0ee766067b05744bb3840ef54c51c85d58f2'
          mkdir -p "$RUNNER_TEMP/h01-h07-evidence/before" "$RUNNER_TEMP/h01-h07-evidence/after"
          cp .github/h01-h07/*.py "$RUNNER_TEMP/"
          cp .github/h01-h07/h07-copy.json "$RUNNER_TEMP/h01-h07-evidence/"
          git worktree add --detach "$RUNNER_TEMP/vault-before" 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa'
          git worktree add --detach "$RUNNER_TEMP/vault-after" 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0'
          date +%F > "$RUNNER_TEMP/h01-h07-evidence/day.txt"
          git diff --stat 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa' 'b5d956ce4a011f43f6ccb3a5ac6be284e41fbaf0' > "$RUNNER_TEMP/h01-h07-evidence/delta-stat.txt"
      - name: Install pinned real Chromium
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/h01-browser"
          "$RUNNER_TEMP/h01-browser/bin/pip" install --disable-pip-version-check playwright==1.57.0
          "$RUNNER_TEMP/h01-browser/bin/python" -m playwright install --with-deps chromium
      - name: Build and measure baseline before any candidate acceptance
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h01-h07-evidence/before"
          cd "$RUNNER_TEMP/vault-before"
          failures=0
          npm ci --no-audit --no-fund 2>&1 | tee "$e/npm.log"
          npm run build 2>&1 | tee "$e/build.log"
          node scripts/verify-static-release-stability.cjs web 2>&1 | tee "$e/static.log"
          "$RUNNER_TEMP/h01-browser/bin/python" "$RUNNER_TEMP/qa_h01_h04.py" --phase before --out out --evidence "$e" --sha 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa' --day "$(cat "$RUNNER_TEMP/h01-h07-evidence/day.txt")" 2>&1 | tee "$e/chromium.log" || failures=$((failures+1))
          "$RUNNER_TEMP/h01-browser/bin/python" "$RUNNER_TEMP/qa_h05_h06.py" --phase before --out out --evidence "$e" --sha 'b40d302ac4594eac60c3929a6c4f0ca855e0a5fa' --day "$(cat "$RUNNER_TEMP/h01-h07-evidence/day.txt")" 2>&1 | tee "$e/chromium-h05-h06.log" || failures=$((failures+1))
          printf 'FAILED_CHECKS=%s\n' "$failures" | tee "$e/collection-status.txt"
          test "$failures" -eq 0
      - name: Build and measure candidate, enforce actual improvements
        if: ${{ !cancelled() && (steps.baseline.outcome == 'success' || steps.baseline.outcome == 'failure') }}
        shell: bash
        run: |
          set -euo pipefail
          e="$RUNNER_TEMP/h01-h07-evidence/after"
          cd "$RUNNER_TEMP/vault-after"
          failures=0
          npm ci --no-audit --no-fund 2>&1 | tee "$e/npm.log"
          node scripts/test-vault-stability-h01-h04.cjs 2>&1 | tee "$e/directed.log" || failures=$((failures+1))
